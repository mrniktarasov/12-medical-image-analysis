[project]
name = "12-medical-image-analysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nikita", email = "nikitatarasov987@gmail.com" },
    { name = "VasiliiDrozdov", email = "vasilii.drozdov.2000@gmail.com" },
    { name = "VSaninV" },
    { name = "Yuliya" }
]
requires-python = ">=3.12"
dependencies = [
    "imagehash>=4.3.2",
    "kagglehub>=1.0.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "tqdm>=4.70.1",
    "opencv-python>=5.0.0.93",
    "jupyter>=1.1.1",
]

[project.scripts]
12-medical-image-analysis = "12_medical_image_analysis:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
